; ============================================================
; PlatformIO — OASYS ESP32 Firmware
; Sistema de Riego con Predicción Climática
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed = 921600

; --- Dependencies ---
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.14
    bblanchon/ArduinoJson@^7.1.0

; --- Build flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_COMMENTS=0

; --- Partition scheme (enough flash for Firebase + WiFi) ---
board_build.partitions = default.csv
